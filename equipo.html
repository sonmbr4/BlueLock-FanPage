<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos - Blue Lock Fan Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/CSS/styleLock.css">
  <link rel="stylesheet" href="assets/CSS/equipos.css">
</head>

<body>
  <!--Pantalla de carga-->
    <div id="loading-screen" class="loading-screen">
        <div class="blue-pentagon-container">
            <div class="pentagon-outline">
                <div class="pentagon-fill" id="pentagon-fill"></div>
            </div>
            <p class="loading-text">CARGANDO EQUIPOS...</p>
        </div>
    </div>

  <!-- Navbar con Bootstrap -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index-lock.html">
        <div class="logo-container">
          <img src="assets/imagenes/BLUE-LOCK-logoV1-header.png" alt="Blue Lock" height="50">
          <img src="assets/imagenes/BLUE-LOCK-logoV2-header.png" alt="Blue Lock Completo" class="logo-hover"
            height="40">
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Barra de navegación secundaria (botones) -->
  <div class="secondary-navbar py-2 bg-dark">
    <div class="container">
      <div class="d-flex justify-content-center flex-wrap">
        <a href="index-lock.html" class="btn btn-outline-light mx-2 mb-2">¿Qué es Blue Lock?</a>
        <a href="jugadores.html" class="btn btn-outline-light mx-2 mb-2">Jugadores</a>
        <a href="equipo.html" class="btn btn-outline-light mx-2 mb-2 active">Equipos</a>
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <main>
    <div class="container-fluid">
      <div class="row">
        <!-- Lista de equipos -->
        <div class="col-md-2 equipo-list-section p-0">
          <div id="equipoList"></div>
        </div>

        <!-- Formación -->
        <div class="col-md-8 formation-container">
          <h2 class="team-title">Equipo Z</h2>
          <div class="formation-field">
            <!-- Jugadores se cargarán dinámicamente -->
          </div>
        </div>

        <!-- Estadísticas -->
        <div class="col-md-2 team-stats-container">
          <h3 class="team-subtitle">Estadísticas</h3>
          <div class="team-stats" id="teamStats">
            <!-- Stats se cargarán dinámicamente -->
          </div>

          <div class="featured-player">
            <!-- Jugador destacado se cargará dinámicamente -->
          </div>
        </div>
      </div>
    </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-primary text-white text-center p-3">
    <p class="mb-0">&copy; 2024 Blue Lock Fan Page</p>
  </footer>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Tu JS personalizado -->
   <script src="assets/JS/principal.js"></script>
  <script src="assets/JS/equipos.js"></script>
</body>

</html>
